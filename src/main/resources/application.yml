spring:
  application:
    name: simple-spring-ai

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:file:./data/simple-ai-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /graphql

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 394858198224-m4qvlkrrqikdeiqe4f9rt5e6e041hoh0.apps.googleusercontent.com
            client-secret: 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
            scope: openid, email
            redirect-uri: http://localhost:3000/api/auth/oauth/callback/{registrationId} # front 포트로 설정

server:
  port: 8080

logging:
  level:
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web: DEBUG
    com.simplejwtauth: DEBUG
    com.simple.ai: DEBUG

app:
