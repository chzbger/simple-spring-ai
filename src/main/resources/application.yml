spring:
  application:
    name: simple-spring-ai

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:file:./data/simple-ai-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /graphql

server:
  port: 8080

